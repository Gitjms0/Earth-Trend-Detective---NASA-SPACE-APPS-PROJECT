<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Trend Detective</title>
<meta name="description" content="Is your place becoming harder to live in? Heat and water trends from 45 years of NASA POWER data.">
<!-- Structure only: styles live in css/style.css and logic in js/ (entry point: js/app.js). -->
<!-- Leaflet (flat map) and Globe.gl (3D globe) load from a CDN; if they fail, the app carries on with what it has. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <p class="brand"><img id="brand-seal" class="brand-seal" alt="" width="40" height="40"><span>Pachamama Data Lab</span></p>
      <button id="lang" type="button" class="ghost-dark"></button>
    </div>
    <p class="eyebrow">
      <!-- Hand-drawn planet Earth: ocean, continents, graticule and highlight. -->
      <svg class="eyebrow-earth" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <radialGradient id="earth-ocean" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#7cc4ff"/><stop offset="55%" stop-color="#2563eb"/><stop offset="100%" stop-color="#0b2a6b"/>
          </radialGradient>
          <clipPath id="earth-clip"><circle cx="32" cy="32" r="29"/></clipPath>
        </defs>
        <circle cx="32" cy="32" r="29" fill="url(#earth-ocean)"/>
        <g clip-path="url(#earth-clip)">
          <g fill="#4ade80">
            <path d="M14 14C20 9 30 10 33 14C35 18 30 20 28 24C26 27 22 26 20 29C17 27 13 24 12 20C11 17 12 15 14 14Z"/>
            <path d="M27 32C31 31 35 33 35 37C35 42 32 46 30 52C28 54 27 50 27 46C26 42 24 37 27 32Z"/>
            <path d="M46 20C51 19 56 22 58 27C59 32 56 36 53 40C51 44 48 46 47 42C46 38 44 34 45 29C43 26 43 22 46 20Z"/>
          </g>
          <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2">
            <ellipse cx="32" cy="32" rx="29" ry="10"/><ellipse cx="32" cy="32" rx="12" ry="29"/><line x1="3" y1="32" x2="61" y2="32"/>
          </g>
          <circle cx="22" cy="18" r="11" fill="#ffffff" fill-opacity="0.16"/>
        </g>
        <circle cx="32" cy="32" r="29" fill="none" stroke="#9ff3e6" stroke-width="2"/>
      </svg>
      <span data-i18n="app.title">Earth Trend Detective</span>
    </p>
    <h1 data-i18n="app.tagline"></h1>
    <p class="intro" data-i18n="app.intro"></p>
    <form id="search" class="search">
      <input id="q" type="search" list="places" autocomplete="off" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.placeholder">
      <datalist id="places"></datalist>
      <input id="birth" type="number" inputmode="numeric" min="1900" max="2026" data-i18n-placeholder="search.birth" data-i18n-aria="search.birth">
      <button type="submit" data-i18n="search.button"></button>
    </form>
  </div>
</header>
<main class="wrap">
  <p id="map-hint" class="muted small" data-i18n="search.map"></p>
  <div class="geo">
    <div id="globe"></div>
    <div id="map" hidden></div>
    <div id="globe-zoom" class="geo-zoom">
      <button id="zoom-in" type="button" data-i18n-aria="geo.zoomIn">+</button>
      <button id="zoom-out" type="button" data-i18n-aria="geo.zoomOut">&minus;</button>
    </div>
    <button id="view-toggle" type="button" class="geo-toggle"></button>
  </div>
  <section class="demos">
    <h2 data-i18n="demo.title"></h2>
    <div id="demo-buttons" class="chips"></div>
  </section>
  <div id="status" aria-live="polite"></div>
  <div id="case"></div>
  <section id="tools" hidden>
    <button id="download" type="button" class="ghost" data-i18n="case.download"></button>
    <form id="compare-form" class="search">
      <input id="q2" type="search" list="places2" autocomplete="off" data-i18n-placeholder="search.compare" data-i18n-aria="search.compare">
      <datalist id="places2"></datalist>
      <button type="submit" data-i18n="search.compare"></button>
    </form>
    <div id="compare-demos" class="chips"></div>
  </section>
  <div id="compare"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/globe.gl"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
