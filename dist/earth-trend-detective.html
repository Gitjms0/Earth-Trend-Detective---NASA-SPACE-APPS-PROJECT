<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Trend Detective</title>
<meta name="description" content="Is your place becoming harder to live in? Heat and water trends from 45 years of NASA POWER data.">
<!-- Structure only: styles live in css/style.css and logic in js/ (entry point: js/app.js). -->
<!-- Leaflet (flat map) and Globe.gl (3D globe) load from a CDN; if they fail, the app carries on with what it has. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/*
 * style.css — Styles for Earth Trend Detective.
 *
 * Visual system (values taken from the Tailwind CSS scale):
 *   - "Slate" neutrals for text and surfaces; a single accent colour (blue).
 *   - Strong colour is reserved for the data: the stripes and the verdicts.
 *   - The background carries a graticule of meridians and parallels, like a map
 *     sheet, on a light sky-blue background: fine lines at 10 % and major lines
 *     at 22 %. It reads as texture
 *     without competing with the data, which sits on white cards on top.
 *   - Spacing in multiples of 4 px; radii of 8 px (controls) and 12 px (cards).
 * Designed mobile-first; grows to tablet and desktop through breakpoints
 * at 560, 768 and 1024 px.
 */
:root {
  --bg: #cde9f8;        /* light sky blue: between sky-100 and sky-200 */
  --bg-panel: #f8fafc;  /* slate-50: inner background of the chapters */
  --card: #ffffff;
  --ink: #0f172a;       /* slate-900 */
  --ink-2: #475569;     /* slate-600 */
  --ink-3: #64748b;     /* slate-500 */
  --line: #e2e8f0;      /* slate-200 */
  --line-soft: #f1f5f9; /* slate-100 */
  --accent: #2563eb;    /* blue-600  */
  --accent-dark: #1d4ed8;
  --hero: #0b1220;
  --teal: #9ff3e6;      /* the aqua green of the team logo */
  --grid: rgb(3 105 161 / 0.10);       /* fine lines every 40 px (sky-700) */
  --grid-major: rgb(3 105 161 / 0.22); /* major lines every 160 px, stronger */
  /* Cards on the sky blue: blue border and bluish shadow so they stand out. */
  --card-border: #93c5fd;               /* blue-300 */
  --card-shadow: 0 1px 2px rgb(30 64 175 / 0.08), 0 6px 18px rgb(30 64 175 / 0.12);
  --radius: 12px;
  --shadow: 0 1px 2px rgb(15 23 42 / 0.06), 0 1px 3px rgb(15 23 42 / 0.08);
  --shadow-lift: 0 1px 2px rgb(15 23 42 / 0.05), 0 4px 12px rgb(15 23 42 / 0.07);
  /* Climate stripes: the same gradient in the brand, on the hero edge
     and anywhere the page needs to recall what it is about. */
  --stripes: linear-gradient(90deg, #2166ac 0 25%, #92c5de 25% 50%, #f4a582 50% 75%, #b2182b 75%);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink);
  background-color: var(--bg);
  /* Graticule (parallels and meridians) on two levels, like a map sheet:
     major lines every 160 px and fine ones every 40 px, over a soft light veil. */
  background-image:
    repeating-linear-gradient(0deg, var(--grid-major) 0 1px, transparent 1px 160px),
    repeating-linear-gradient(90deg, var(--grid-major) 0 1px, transparent 1px 160px),
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 40px),
    radial-gradient(120% 70% at 50% 0%, rgb(255 255 255 / 0.35) 0%, rgb(255 255 255 / 0) 60%);
  font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.wrap {
  max-width: 768px; margin: 0 auto;
  padding: 0 16px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
}
main.wrap { padding-top: 16px; padding-bottom: 64px; }
h2 { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 12px; }
h3 { font-size: 1.125rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
h4 { font-size: 1rem; font-weight: 600; margin: 0; }
p { margin: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 0.8125rem; }
strong { font-weight: 600; }

/* ---------- Header ----------
 * A night sky with the limb of a globe coming in from the right: a few
 * star points, very faint concentric rings (the globe's graticule) and the
 * blue halo of dawn. It closes with the climate stripes.
 */
.hero {
  position: relative;
  color: #e2e8f0; padding: 20px 0 32px;
  background-color: var(--hero);
  background-image:
    radial-gradient(1.5px 1.5px at 11% 22%, rgb(255 255 255 / 0.55), transparent 100%),
    radial-gradient(1.5px 1.5px at 27% 9%, rgb(255 255 255 / 0.4), transparent 100%),
    radial-gradient(1px 1px at 41% 31%, rgb(255 255 255 / 0.45), transparent 100%),
    radial-gradient(1.5px 1.5px at 63% 14%, rgb(255 255 255 / 0.35), transparent 100%),
    radial-gradient(1px 1px at 78% 38%, rgb(255 255 255 / 0.5), transparent 100%),
    radial-gradient(1.5px 1.5px at 92% 12%, rgb(255 255 255 / 0.3), transparent 100%),
    radial-gradient(1px 1px at 55% 72%, rgb(255 255 255 / 0.3), transparent 100%),
    repeating-radial-gradient(circle at 112% -15%, transparent 0 62px, rgb(159 243 230 / 0.07) 62px 63px),
    radial-gradient(120% 140% at 85% -20%, #1e3a8a 0%, rgb(30 58 138 / 0) 55%);
}
/* The climate stripes close the header: the data, as a border. */
.hero::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
  background: var(--stripes);
}
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 32px; }
/* Top left, the team signs: its seal (without letters) and its name. */
.brand { display: flex; align-items: center; gap: 10px; font-size: 0.9375rem; font-weight: 600; letter-spacing: 0.02em; color: #e2e8f0; margin: 0; }
.brand-seal { width: 40px; height: 40px; display: block; }
/* The project name sits above the headline, with a small planet Earth.
   The planet is our own SVG drawing (no third-party rights, no external files). */
.eyebrow { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); }
.eyebrow-earth { width: 24px; height: 24px; flex: none; display: block; }
/* Headline and intro span the full width, aligned with the search bar. */
.hero h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.15; letter-spacing: -0.025em; font-weight: 700; color: #fff; margin: 0 0 12px; }
.intro { color: #94a3b8; margin-bottom: 24px; }

/* ---------- Controls ---------- */
.search { display: flex; flex-wrap: wrap; gap: 8px; }
.search input {
  flex: 1 1 200px; min-width: 0; padding: 12px 14px; font: inherit; color: var(--ink);
  background: #fff; border: 1px solid var(--line); border-radius: 8px;
}
#birth { flex: 1 1 180px; }
.search input::placeholder { color: #64748b; }
.search input:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
button {
  padding: 12px 20px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
  color: #fff; background: var(--accent); transition: background-color 150ms ease-out, border-color 150ms ease-out;
}
button:hover { background: var(--accent-dark); }
button.ghost, .chips button { background: #fff; color: var(--ink); border: 1px solid var(--card-border); box-shadow: var(--shadow); }
button.ghost:hover, .chips button:hover { background: #eff6ff; border-color: var(--accent); }
.ghost-dark { padding: 6px 12px; font-size: 0.8125rem; font-weight: 500; color: #cbd5e1; background: transparent; border: 1px solid rgb(148 163 184 / 0.4); }
.ghost-dark:hover { background: rgb(148 163 184 / 0.15); }

/* ---------- Map and example cases ---------- */
/* ---------- Picking the place: 3D globe or flat map ---------- */
.geo { position: relative; margin: 8px 0 24px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--hero); box-shadow: var(--shadow-lift); overflow: hidden; }
/* CSS sets the height: globe.js reads it from the container on resize. */
#globe, #map { height: clamp(260px, 48vw, 420px); }
#globe { cursor: grab; }
#globe:active { cursor: grabbing; }
.geo-zoom { position: absolute; right: 12px; top: 12px; z-index: 500; display: grid; gap: 6px; }
.geo-zoom button, .geo-toggle {
  background: rgba(10, 18, 32, 0.72); border: 1px solid rgba(148, 163, 184, 0.35); color: #e2e8f0;
  backdrop-filter: blur(6px); font-weight: 500; transition: background-color 150ms ease-out;
}
.geo-zoom button { width: 34px; height: 32px; padding: 0; font-size: 1rem; line-height: 1; }
.geo-zoom button:hover, .geo-toggle:hover { background: rgba(37, 99, 235, 0.85); }
.geo-toggle { position: absolute; right: 12px; bottom: 12px; z-index: 500; padding: 7px 12px; font-size: 0.8125rem; }
.demos { margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chips button { padding: 8px 14px; font-weight: 500; text-align: left; line-height: 1.35; border-left: 4px solid var(--accent); }
/* Loose text on the sky blue: a darker grey so it reads with enough contrast. */
main > .muted, .case-head .muted, .case > .muted { color: var(--ink-2); }
.chips button span { display: block; font-size: 0.75rem; color: var(--ink-3); font-weight: 400; }

/* ---------- Notices ---------- */
.loading, .error { padding: 12px 16px; border-radius: 8px; background: #fff; border: 1px solid var(--card-border); margin: 8px 0; box-shadow: var(--shadow); }
.error { border-color: #fecaca; background: #fef2f2; color: #991b1b; }

/* ---------- Case file ---------- */
.case-head { margin: 24px 0 16px; }
.case-head h2 { font-size: 1.5rem; letter-spacing: -0.02em; margin-bottom: 4px; }
.summary { margin-top: 10px; font-size: 1.125rem; font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
.story { margin-top: 12px; padding-left: 12px; border-left: 3px solid var(--accent); color: var(--ink-2); font-size: 1.0625rem; }
/* Rows live inside a chapter and take its colour (--tint). */
.row { background: var(--card); border: 1px solid color-mix(in srgb, var(--tint, #64748b) 25%, #fff); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.row header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
/* Verdict: ui.js sets the colour through the --vc variable. */
.verdict {
  --vc: #64748b; color: var(--vc); background: color-mix(in srgb, var(--vc) 10%, #fff);
  border-radius: 999px; padding: 4px 12px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap;
}
.verdict.small { font-size: 0.6875rem; padding: 2px 8px; }
.stripes { display: flex; height: 64px; border-radius: 8px; overflow: hidden; }
.stripes i { flex: 1; }
.stripe-axis { display: flex; justify-content: space-between; margin-top: 4px; font-size: 0.75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.rate { margin-top: 12px; font-size: 1.125rem; font-variant-numeric: tabular-nums; }
.rate .muted { font-size: 0.875rem; }
.help { margin-top: 2px; font-size: 0.875rem; }
.caveat { margin-top: 8px; padding: 8px 12px; border-left: 3px solid #f59e0b; background: #fffbeb; color: #78350f; font-size: 0.875rem; border-radius: 0 8px 8px 0; }
.birth { margin-top: 12px; padding: 10px 12px; background: #eff6ff; border-radius: 8px; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.birth-tag { display: block; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-dark); }
.note { display: block; color: var(--ink-3); font-size: 0.8125rem; }
details { margin-top: 12px; }
details p { margin-top: 8px; font-size: 0.9375rem; color: var(--ink-2); }
summary { cursor: pointer; color: var(--accent); font-weight: 500; font-size: 0.875rem; }
.chart { width: 100%; height: auto; margin-top: 12px; }
.chart text { font-size: 11px; fill: var(--ink-3); }
.chart .axis { stroke: var(--line); }
.chart .series { fill: none; stroke: #334155; stroke-width: 1.5; }
.chart .trend { stroke: #b2182b; stroke-width: 2; stroke-dasharray: 6 4; }
.method { background: #fff; border: 1px solid var(--card-border); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 12px 16px; box-shadow: var(--card-shadow); }

/* ---------- Tools and comparison ---------- */
#tools { margin: 16px 0 24px; display: grid; gap: 12px; }
#tools .chips { margin-bottom: 0; }
.compare { margin-top: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.compare table { width: 100%; min-width: 440px; border-collapse: separate; border-spacing: 0; background: #fff; border: 1px solid var(--card-border); border-radius: var(--radius); overflow: hidden; font-size: 0.875rem; box-shadow: var(--card-shadow); font-variant-numeric: tabular-nums; }
.compare th, .compare td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
.compare thead th { font-size: 0.75rem; font-weight: 600; color: #1e40af; }
.compare thead th, .compare thead td { background: #eff6ff; }
.compare tbody th { font-weight: 500; }
.compare tr:last-child th, .compare tr:last-child td { border-bottom: 0; }
.compare tr.opposite { background: #fffbeb; }
.compare tr.opposite td:last-child { font-weight: 600; color: #b45309; }
.compare td:last-child { color: var(--ink-3); }
@media (max-width: 480px) { .compare th, .compare td { padding: 8px; font-size: 0.8125rem; } }

/* ---------- Chapters: each one is a closed block with its own colour ---------- */
/* Border and shadow take the chapter colour: each block stands out from the sky-blue
   background and is recognised by its colour (red heat, teal water, blue others). */
.chapter {
  --tint: #1d4ed8; --tint-soft: #eff6ff; margin: 28px 0;
  border: 1px solid color-mix(in srgb, var(--tint) 35%, #fff); border-top: 5px solid var(--tint);
  border-radius: var(--radius); background: #fff; overflow: hidden;
  box-shadow: 0 1px 2px color-mix(in srgb, var(--tint) 12%, transparent), 0 8px 22px color-mix(in srgb, var(--tint) 18%, transparent);
}
.chapter[data-chapter="heat"] { --tint: #b91c1c; --tint-soft: #fef2f2; }
.chapter[data-chapter="water"] { --tint: #0e7490; --tint-soft: #ecfeff; }
.chapter-head { padding: 16px 18px; background: var(--tint-soft); border-bottom: 1px solid color-mix(in srgb, var(--tint) 20%, #fff); }
.chapter-head h3 { display: flex; align-items: center; gap: 9px; color: var(--tint); }
.chapter-icon { font-size: 1.3rem; line-height: 1; }
.chapter-q { color: var(--ink-2); margin-top: 2px; font-size: 0.9375rem; }
.chapter-body { padding: 16px 18px 18px; background: color-mix(in srgb, var(--tint) 4%, #fff); }
.chapter-body > .row:first-child { margin-top: 0; }
.chips-verdict { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; padding: 0; list-style: none; }
.chips-verdict .verdict { text-transform: none; letter-spacing: 0; font-size: 0.75rem; background: #fff; }
.row.featured { border-color: color-mix(in srgb, var(--tint) 45%, #fff); border-left: 4px solid var(--tint); box-shadow: 0 2px 10px color-mix(in srgb, var(--tint) 14%, transparent); }
.row:not(.featured) { box-shadow: none; }
details.more { margin: 12px 0 0; }
details.more > summary { padding: 8px 0; }
details.more[open] { padding-bottom: 4px; }
/* Advice: a grid of large icons with very little text. */
.advice { margin-top: 14px; background: #fff; border: 1px solid color-mix(in srgb, var(--tint) 25%, #fff); border-radius: var(--radius); padding: 14px 16px; }
.advice h4 { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tint); margin: 0 0 12px; }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
.actions li { display: flex; flex-direction: column; gap: 6px; padding: 12px 10px; background: var(--tint-soft); border: 1px solid var(--line-soft); border-radius: 10px; font-size: 0.875rem; line-height: 1.3; text-align: center; align-items: center; }
.act-icon { font-size: 1.75rem; line-height: 1; }
.for-who { margin: 12px 0 0; font-size: 0.8125rem; color: var(--ink-3); }
.for-who b { color: var(--ink-2); }
details.why { margin-top: 8px; }
details.why > summary { font-size: 0.8125rem; }
details.why .context { margin-top: 8px; }

/* The folded chapter (extra indicators) looks like a discreet row. */
.chapter.folded { padding: 14px 18px; background: #fff; }
.chapter.folded > summary { font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chapter.folded .chapter-body { margin: 10px -18px -14px; }

/* ---------- Adapting to each screen ----------
 * Narrow phone: one column and full-width controls.
 * Tablet: the base layout already fits on one row.
 * Desktop: a slightly longer reading measure and larger body text.
 */

/* Phone (≤ 560 px) */
@media (max-width: 560px) {
  .hero { padding: 16px 0 24px; }
  .hero-top { margin-bottom: 24px; }
  .intro { margin-bottom: 20px; }
  /* The search bar stacks: each field full width, no cut-off text. */
  #search, #compare-form { display: grid; grid-template-columns: 1fr; }
  .row, .advice { padding: 14px; }
  .chapter-head, .chapter-body { padding-left: 14px; padding-right: 14px; }
  .chapter.folded { padding-left: 14px; padding-right: 14px; }
  .chapter.folded .chapter-body { margin-left: -14px; margin-right: -14px; }
  .case-head h2 { font-size: 1.3125rem; }
  .summary { font-size: 1.0625rem; }
  .story { font-size: 1rem; }
  .chips button { flex: 1 1 140px; }
  .stripes { height: 56px; }
}

/* Touch screens: no control shorter than 44 px. */
@media (pointer: coarse) {
  .geo-zoom { gap: 8px; }
  .geo-zoom button { width: 44px; height: 44px; font-size: 1.125rem; }
  .geo-toggle { padding: 11px 14px; }
  summary { padding: 4px 0; }
  .chips button { padding: 11px 14px; }
  .ghost-dark { padding: 10px 14px; }
}

/* Phone in landscape: the globe must not take up the whole screen. */
@media (max-height: 540px) and (orientation: landscape) {
  #globe, #map { height: 68vh; }
  .hero { padding-bottom: 20px; }
}

/* Tablet (≥ 640 px) */
@media (min-width: 640px) {
  .actions { grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); }
  .chapter-head, .chapter-body { padding-left: 20px; padding-right: 20px; }
}

/* Desktop and large tablet (≥ 1024 px) */
@media (min-width: 1024px) {
  body { font-size: 17px; }
  .wrap { max-width: 860px; }
  .hero { padding: 24px 0 40px; }
  main.wrap { padding-top: 24px; }
  /* At this size the headline fits on a single full-width line. */
  .hero h1 { font-size: 2.25rem; }
  .stripes { height: 72px; }
}

/* Whoever asks for less motion does not get it. */
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <p class="brand"><img id="brand-seal" class="brand-seal" alt="" width="40" height="40"><span>Pachamama Data Lab</span></p>
      <button id="lang" type="button" class="ghost-dark"></button>
    </div>
    <p class="eyebrow">
      <!-- Hand-drawn planet Earth: ocean, continents, graticule and highlight. -->
      <svg class="eyebrow-earth" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <radialGradient id="earth-ocean" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#7cc4ff"/><stop offset="55%" stop-color="#2563eb"/><stop offset="100%" stop-color="#0b2a6b"/>
          </radialGradient>
          <clipPath id="earth-clip"><circle cx="32" cy="32" r="29"/></clipPath>
        </defs>
        <circle cx="32" cy="32" r="29" fill="url(#earth-ocean)"/>
        <g clip-path="url(#earth-clip)">
          <g fill="#4ade80">
            <path d="M14 14C20 9 30 10 33 14C35 18 30 20 28 24C26 27 22 26 20 29C17 27 13 24 12 20C11 17 12 15 14 14Z"/>
            <path d="M27 32C31 31 35 33 35 37C35 42 32 46 30 52C28 54 27 50 27 46C26 42 24 37 27 32Z"/>
            <path d="M46 20C51 19 56 22 58 27C59 32 56 36 53 40C51 44 48 46 47 42C46 38 44 34 45 29C43 26 43 22 46 20Z"/>
          </g>
          <g fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.2">
            <ellipse cx="32" cy="32" rx="29" ry="10"/><ellipse cx="32" cy="32" rx="12" ry="29"/><line x1="3" y1="32" x2="61" y2="32"/>
          </g>
          <circle cx="22" cy="18" r="11" fill="#ffffff" fill-opacity="0.16"/>
        </g>
        <circle cx="32" cy="32" r="29" fill="none" stroke="#9ff3e6" stroke-width="2"/>
      </svg>
      <span data-i18n="app.title">Earth Trend Detective</span>
    </p>
    <h1 data-i18n="app.tagline"></h1>
    <p class="intro" data-i18n="app.intro"></p>
    <form id="search" class="search">
      <input id="q" type="search" list="places" autocomplete="off" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.placeholder">
      <datalist id="places"></datalist>
      <input id="birth" type="number" inputmode="numeric" min="1900" max="2026" data-i18n-placeholder="search.birth" data-i18n-aria="search.birth">
      <button type="submit" data-i18n="search.button"></button>
    </form>
  </div>
</header>
<main class="wrap">
  <p id="map-hint" class="muted small" data-i18n="search.map"></p>
  <div class="geo">
    <div id="globe"></div>
    <div id="map" hidden></div>
    <div id="globe-zoom" class="geo-zoom">
      <button id="zoom-in" type="button" data-i18n-aria="geo.zoomIn">+</button>
      <button id="zoom-out" type="button" data-i18n-aria="geo.zoomOut">&minus;</button>
    </div>
    <button id="view-toggle" type="button" class="geo-toggle"></button>
  </div>
  <section class="demos">
    <h2 data-i18n="demo.title"></h2>

      const v = raw === undefined || raw === null || raw === FILL || !Number.isFinite(raw) ? null : raw;
      byMonth[m].push(v);
      if (v !== null) { sum += v; n++; }
    }
    // Rounded to 6 decimals: without this, two equal years differ in the last bit
    // and the Mann-Kendall test does not recognise them as a tie.
    annual.push(n === 12 ? Math.round((sum / 12) * 1e6) / 1e6 : null);
  }
  return { years, annual, byMonth };
}

/** Converts the full response: an object { CODE: series } with the 6 variables. */
function parseAll(json) {
  return Object.fromEntries(PARAMS.map((p) => [p, parsePower(json, p)]));
}

/**
 * Downloads the data for one point. Rejects with Error('timeout' | 'network' | 'http <code>').
 * @param {number} lat  @param {number} lon  @param {{timeoutMs?:number}} [opts]  @returns {Promise<object>}
 */
async function fetchPower(lat, lon, { timeoutMs = 20000 } = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(buildUrl(lat, lon), { signal: ctrl.signal });
    if (!res.ok) throw new Error(`http ${res.status}`);
    return await res.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('timeout');
    if (String(e.message).startsWith('http ')) throw e;
    throw new Error('network');
  } finally { clearTimeout(timer); }
}

 *            clamped:boolean, early:number|null, recent:number|null, diff:number|null, verdict:string}}

 *    NOAA uses a simpler expression, which is not the air temperature but a
 *    combination of temperature and humidity very close to it (in cold weather it
 *    can come out a couple of degrees lower).
 *  - The switch between branches at 27 °C is not continuous, so averaging the twelve
 *    months can produce small steps. The confidence range the app publishes comes out
 *    somewhat narrower than it should.

 *  - It is a monthly "in the shade" value: it measures typical heat, not one specific afternoon.

/**

 * It is a pure function: it takes series and returns an object ready to draw,
 * already arranged into the chapters the user sees.
 */

 * If they arrive already computed (as in the example cases), they are kept.

/**

 * @param {{lat:number, lon:number, label:string}} place
 * @param {number|null} birthYear year of birth, or null if not given
 * @returns {{place:object, birthYear:number|null, period:{from:number|null,to:number|null},
 *            rows:object[], chapters:object[], summary:string}}

 *   chapters repeats those rows grouped: { chapter, rows, featured, others, state }.

      to = to === null ? result.years.at(-1) : Math.max(to, result.years.at(-1));

  const chapters = CHAPTERS.map((chapter) => {
    const list = chapter.codes.map((c) => byCode[c]).filter(Boolean);
    const featured = chapter.featured ? byCode[chapter.featured] : null;
    return {
      chapter,
      rows: list,
      featured: featured && featured.result.verdict !== 'insufficient'
        ? featured
        : (list.find((r) => r.result.verdict !== 'insufficient') || list[0] || null),
      state: chapterState(list),
      evidence: hasEvidence(featured, list),
      direction: chapterDirection(featured, list),

  const heat = chapters.find((c) => c.chapter.id === 'heat')?.evidence;
  const water = chapters.find((c) => c.chapter.id === 'water')?.evidence;

    : heat ? 'summary.heat'

/**

 * Its main variable must confirm it, or at least two variables must agree: with
 * five variables tested at 5%, a single positive one can be due to chance.

function hasEvidence(featured, rows) {

 * Where the chapter is heading: 'up', 'down' or null if nothing is clear.
 * The main variable decides when it changes itself; otherwise, the majority of those that do.

function chapterDirection(featured, rows) {
  const moving = rows.filter((r) => r.result.verdict === 'yes' || r.result.verdict === 'maybe');
  if (!moving.length) return null;
  const pick = moving.includes(featured) ? [featured] : moving;
  const sum = pick.reduce((a, r) => a + Math.sign(r.result.perDecade || 0), 0);

  for (const v of order) if (rows.some((r) => r.result.verdict === v)) return v;

function hasData(model) {
  return model.rows.some((r) => r.result.verdict !== 'insufficient');
}

/**
 * geo.js — Place search.

async function searchPlace(query, lang = 'es') {

  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=${lang}&q=${encodeURIComponent(q)}`;

/**
 * Turns the Photon response into suggestions ready to show.
 * @param {object} json  @returns {{lat:number, lon:number, label:string}[]}
 */
function parseSuggestions(json) {
  const out = [], seen = new Set();
  for (const f of json?.features || []) {

    if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    const label = photonLabel(f.properties || {});
    if (!label || seen.has(label)) continue;

/**

 * @returns {Promise<{lat:number, lon:number, label:string}[]>}
 */
async function suggestPlaces(query, lang = 'es', { signal } = {}) {
  const q = (query || '').trim();
  if (q.length < 3) return [];
  const url = `https://photon.komoot.io/api/?limit=6&lang=${lang === 'es' ? 'es' : 'en'}&q=${encodeURIComponent(q)}`;
  try {
    const res = await fetch(url, { signal });
    if (!res.ok) return [];
    return parseSuggestions(await res.json());
  } catch { return []; }
}

/**
 * Name of a point from its coordinates, in the requested language.
 * It serves two purposes: naming a point tapped on the globe or the map, and
 * fetching the name again when the user switches the page language.
 * Never throws: on failure it returns null and any existing name is kept.
 * @param {number} lat  @param {number} lon  @param {'es'|'en'} lang
 * @returns {Promise<string|null>}
 */
async function nameOfPoint(lat, lon, lang = 'es') {
  const url = `https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&accept-language=${lang}&lat=${lat}&lon=${lon}`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) return null;
    const j = await res.json();
    return j?.display_name || null;
  } catch { return null; } finally { clearTimeout(timer); }
}

/**
 * The name of a place in the page language.
 * Example places carry their name in both languages ({es, en}); searched places
 * carry a single text, which is used as is.
 * @param {{label: string|{es:string,en:string}}} place  @param {'es'|'en'} lang
 */
function labelOf(place, lang = 'es') {
  const l = place?.label;
  if (!l) return '';
  return typeof l === 'string' ? l : (l[lang] || l.es || Object.values(l)[0] || '');
}

/**
 * globe.js — The 3D globe used to pick a place.
 *
 * Uses Globe.gl (on top of three.js) with NASA's Blue Marble texture. A tap on any
 * point returns its latitude and longitude, just like the flat map: for the rest of
 * the app the two are interchangeable.
 *
 * If the library failed to load (no internet, or blocked), `createGlobe` returns
 * null and the caller falls back to the flat map. Never throws.
 */

const TEXTURE = 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg';
const MARK = '#fbbf24';   // the example places
const PICK = '#60a5fa';   // the point the user picked

/**
 * @param {HTMLElement} el container; it sizes itself to the available width
 * @param {{places?: object[], onPick?: (lat:number, lon:number, place?:object) => void, height?: number}} opts
 *   places: places to mark, each { lat, lon, label }
 *   onPick: called with the picked coordinates; if a marker was tapped, also with it
 * @returns {{setMarks:Function, setPicked:Function, focus:Function, resize:Function, stopSpin:Function}|null}
 */
function createGlobe(el, { places = [], onPick = () => {}, height = 360 } = {}) {
  if (typeof window === 'undefined' || !window.Globe || !el) return null;
  let marks = places.map((p) => ({ lat: p.lat, lng: p.lon, place: p }));
  let picked = null;

  const all = () => (picked ? marks.concat([picked]) : marks);
  const g = window.Globe()(el)
    .globeImageUrl(TEXTURE)
    .backgroundColor('rgba(0,0,0,0)')
    .pointColor((d) => (d.sel ? PICK : MARK))
    .pointAltitude((d) => (d.sel ? 0.08 : 0.035))
    .pointRadius((d) => (d.sel ? 0.7 : 0.45))
    .pointsData(all())
    .ringColor(() => (t) => `rgba(251,191,36,${1 - t})`)
    .ringMaxRadius(5).ringPropagationSpeed(1.6).ringRepeatPeriod(1400)
    .ringsData(marks)
    .onPointClick((d) => onPick(d.lat, d.lng, d.place))
    .onGlobeClick((c) => onPick(c.lat, c.lng));

  const c = g.controls();
  c.autoRotate = true; c.autoRotateSpeed = 0.45;
  c.enableZoom = true; c.minDistance = 130; c.maxDistance = 420;

  const api = {
    /** Changes the marked places (for example when switching language). */
    setMarks(list) { marks = list.map((p) => ({ lat: p.lat, lng: p.lon, place: p })); g.ringsData(marks).pointsData(all()); },
    /** Marks the picked point and stops the spin. */
    setPicked(lat, lon) { picked = { lat, lng: lon, sel: true }; c.autoRotate = false; g.pointsData(all()); },
    /** Moves the view to a point. */
    focus(lat, lon, altitude = 1.1) { c.autoRotate = false; g.pointOfView({ lat, lng: lon, altitude }, 600); },
    stopSpin() { c.autoRotate = false; },
    /** Zooms in or out; f < 1 zooms in. */
    zoom(f) { const p = g.pointOfView(); g.pointOfView({ ...p, altitude: Math.max(0.35, Math.min(2.6, p.altitude * f)) }, 400); },
    /* The height is set by the CSS (#globe uses clamp), so it is read from the
       container; `height` is only a fallback if the CSS does not define it. */
    resize() { g.width(el.clientWidth).height(el.clientHeight || height); },
  };
  api.resize();
  g.pointOfView({ lat: -10, lng: -70, altitude: 2.1 });
  return api;
}

/** The seal as a data URI: used both in the header and in the downloadable case file. */
const SEAL_URI = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(SEAL)}`;

let pending = null;
/**
 * The seal as an image ready to draw on a canvas.
 * It is a data URI, so it does not taint the canvas and `toBlob` keeps working.
 * @returns {Promise<HTMLImageElement|null>} null if the browser could not load it
 */
function sealImage() {
  if (pending) return pending;
  pending = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = SEAL_URI;
  });
  return pending;
}

/**
 * ui.js — Drawing of the case file: stripes, verdicts, chart, comparison and image.
 *
 * The calculation functions (stripeColors, formatRate, compareRows) are pure and can be tested on their own.
 * The render* functions write HTML into a container. Every text that comes from outside
 * (for example, the place name) goes through esc() to prevent HTML injection.
 */


const PALETTES = {
  heat: ['#2166ac', '#f7f7f7', '#b2182b'],
  water: ['#8c510a', '#f5f5f5', '#01665e'],
  sun: ['#4d5a6b', '#f5f5f5', '#d98e04'],
};
const GRAY = '#d0d0d0';
// Colours with enough contrast to be read on a light background.
const VERDICT_COLOR = { yes: '#b91c1c', maybe: '#92400e', none: '#475569', insufficient: '#475569' };

/**
 * The verdict, stating which way the change goes. Without a direction, a chapter that
 * asks "more or less water?" answered "yes, it is changing" and read the wrong way round.
 */
function verdictKey(result) {
  const s = Math.sign(result.perDecade || 0);
  if ((result.verdict === 'yes' || result.verdict === 'maybe') && s !== 0)
    return `verdict.${result.verdict}.${s > 0 ? 'up' : 'down'}`;
  return `verdict.${result.verdict}`;
}

const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = (c) => '#' + c.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');
const mix = (a, b, k) => rgb2hex(hex2rgb(a).map((v, i) => v + (hex2rgb(b)[i] - v) * k));
const isNum = (v) => v !== null && v !== undefined && Number.isFinite(v);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/**
 * One colour per year, according to how far that year is from the series mean
 * (symmetric scale of ±2 standard deviations). Years without data are shown in grey.
 * @param {(number|null)[]} values  @param {'heat'|'water'|'sun'} palette  @returns {string[]} #rrggbb colours
 */
function stripeColors(values, palette) {
  const [lo, mid, hi] = PALETTES[palette] || PALETTES.heat;
  const nums = values.filter(isNum);
  const mean = nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
  const sd = nums.length ? Math.sqrt(nums.reduce((a, b) => a + (b - mean) ** 2, 0) / nums.length) : 0;
  return values.map((v) => {
    if (!isNum(v)) return GRAY;
    const k = sd > 0 ? Math.max(-1, Math.min(1, (v - mean) / (2 * sd))) : 0;
    return k < 0 ? mix(mid, lo, -k) : mix(mid, hi, k);
  });
}

/** Number with the language's decimals and separator; `signed` prepends + or −. */
function formatNum(x, decimals, lang, signed = false) {
  const abs = Math.abs(x).toFixed(decimals);
  const body = lang === 'en' ? abs : abs.replace('.', ',');
  const zero = Number(abs) === 0;
  const sign = !signed || zero ? (x < 0 && !zero ? '−' : '') : x < 0 ? '−' : '+';
  return sign + body;
}

/** Rate per decade ready to show, e.g. "+0.3 °C per decade". */
function formatRate(perDecade, unit, decimals, lang) {
  return `${formatNum(perDecade, decimals, lang, true)} ${unit} ${t(lang, 'case.perDecade')}`;
}

/**
 * Compares two cases variable by variable.
 * `opposite` is true only if the signs differ AND both places have evidence of change.
 */
function compareRows(modelA, modelB) {
  const evid = (v) => v === 'yes' || v === 'maybe';
  const main = new Set(CHAPTERS.filter((c) => c.open).flatMap((c) => c.codes));
  return modelA.rows.filter((r) => main.has(r.variable.code)).map((ra) => {
    const rb = modelB.rows.find((r) => r.variable.code === ra.variable.code);
    const a = { perDecade: ra.result.perDecade, verdict: ra.result.verdict };
    const b = { perDecade: rb.result.perDecade, verdict: rb.result.verdict };
    const both = evid(a.verdict) && evid(b.verdict);
    const sa = Math.sign(a.perDecade), sb = Math.sign(b.perDecade);
    return { variable: ra.variable, a, b, both, opposite: both && sa * sb < 0, same: both && sa * sb > 0 };
  });
}

// --- HTML ---
function stripesHtml(row, lang) {
  const colors = stripeColors(row.annual, row.variable.palette);
  const r = row.result, label = `${row.variable.name[lang]}: ${t(lang, verdictKey(r))}`;
  const bars = colors.map((c, i) => `<i style="background:${c}" title="${row.years[i]}"></i>`).join('');
  const first = row.years[0] ?? '', last = row.years.at(-1) ?? '';
  return `<div class="stripes" role="img" aria-label="${esc(label)}, ${first}–${last}">${bars}</div><div class="stripe-axis"><span>${first}</span><span>${last}</span></div>`;
}

function chartSvg(row, lang) {
  const pts = row.years.map((y, i) => [y, row.annual[i]]).filter(([, v]) => isNum(v));
  if (pts.length < 2) return '';
  const W = 600, H = 200, L = 46, R = 10, Tp = 10, B = 24;
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y0 === y1) { y0 -= 1; y1 += 1; }
  const X = (x) => L + ((x - x0) / (x1 - x0)) * (W - L - R), Y = (y) => Tp + (1 - (y - y0) / (y1 - y0)) * (H - Tp - B);
  const line = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${X(x).toFixed(1)} ${Y(y).toFixed(1)}`).join('');
  // Trend line: the same Sen slope shown as the rate.
  const r = row.result, clampY = (y) => Math.max(y0, Math.min(y1, y));
  const trend = r.mk ? `<line x1="${X(x0)}" y1="${Y(clampY(r.intercept + r.sen * x0))}" x2="${X(x1)}" y2="${Y(clampY(r.intercept + r.sen * x1))}" class="trend"/>` : '';
  const d = row.variable.decimals > 2 ? 2 : 1;
  const num = (v) => formatNum(v, d, lang);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${x0}–${x1}"><line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" class="axis"/>
<text x="${L - 6}" y="${Y(y1) + 4}" text-anchor="end">${num(y1)}</text><text x="${L - 6}" y="${Y(y0) + 4}" text-anchor="end">${num(y0)}</text>
<text x="${L}" y="${H - 6}">${x0}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${x1}</text>
<path d="${line}" class="series"/>${trend}</svg>`;
}

function birthHtml(row, lang) {
  const b = row.birth;
  if (!b) return '';
  const unit = unitOf(row.variable, lang);
  let body;
  if (b.status === 'ok') {
    const diff = `<strong>${formatNum(b.diff, row.variable.decimals, lang, true)} ${esc(unit)}</strong>`;
    body = t(lang, 'birth.since', { from: b.fromYear, fromEnd: b.fromYear + 9, to0: b.toYear - 9, to: b.toYear, diff });
    if (b.clamped) body += ` <span class="note">${t(lang, 'birth.clamped', { year: b.fromYear })}</span>`;
  } else if (b.status === 'tooRecent') body = t(lang, 'birth.tooRecent', { year: b.fromYear });
  else body = t(lang, 'birth.insufficient');
  return `<p class="birth"><span class="birth-tag">${t(lang, 'birth.title')}</span> ${body}</p>`;
}

/** A full variable: stripes, rate, verdict and folded detail. */
function rowHtml(row, lang, featured = false) {
  const v = row.variable, r = row.result, unit = unitOf(v, lang);
  const rate = r.verdict === 'insufficient'
    ? `<p class="rate muted">${t(lang, 'case.noRate')}</p>`
    : `<p class="rate"><strong>${esc(formatRate(r.perDecade, unit, v.decimals, lang))}</strong> <span class="muted">(${t(lang, 'case.range', { lo: formatNum(r.ci.lo * 10, v.decimals, lang, true), hi: formatNum(r.ci.hi * 10, v.decimals, lang, true) })})</span></p>`;
  return `<article class="row${featured ? ' featured' : ''}">
  <header><h4>${esc(v.name[lang])}</h4><span class="verdict" style="--vc:${VERDICT_COLOR[r.verdict]}" title="${esc(t(lang, `verdict.${r.verdict}.help`))}">${t(lang, verdictKey(r))}</span></header>
  ${stripesHtml(row, lang)}
  ${rate}
  <p class="help muted">${t(lang, `verdict.${r.verdict}.help`)}</p>
  ${v.caveat ? `<p class="caveat">${esc(v.caveat[lang])}</p>` : ''}
  ${birthHtml(row, lang)}
  <details><summary>${t(lang, 'case.chart')}</summary>
    ${chartSvg(row, lang)}
    ${r.mk ? `<p class="muted small">${t(lang, 'case.trendLine')} ${t(lang, 'case.stats', { n: r.n, p: r.mk.p < 0.001 ? `< ${formatNum(0.001, 3, lang)}` : formatNum(r.mk.p, 3, lang), r1: formatNum(r.r1, 2, lang) })}</p>` : ''}
    <p><strong>${t(lang, 'case.what')}:</strong> ${esc(v.what[lang])}</p>
    <p><strong>${t(lang, 'case.why')}:</strong> ${esc(v.why[lang])}</p>
    <p class="muted">${t(lang, 'case.source', { source: esc(v.source) })}</p>
  </details>
</article>`;
}

/** The verdict pills in the chapter header, one per variable. */
function chipsHtml(rows, lang) {
  return `<ul class="chips-verdict">${rows.map((r) => `<li class="verdict small" style="--vc:${VERDICT_COLOR[r.result.verdict]}">${esc(r.variable.short[lang])}: ${t(lang, verdictKey(r.result))}</li>`).join('')}</ul>`;
}

/**
 * The advice that follows the result. It changes with the verdict and its direction:
 * the advice is not the same where water increases as where it is scarce, nor where
 * there is no evidence of change. Short text and one icon each, to read at a glance.
 */
function adviceHtml(chapter, group, lang) {
  if (!chapter.actions) return '';
  const key = group.evidence && group.direction ? group.direction : 'none';
  const list = chapter.actions[key] || chapter.actions.none || [];
  if (!list.length) return '';
  return `<section class="advice">
  <h4>${t(lang, 'case.means')}</h4>
  <ul class="actions">${list.map((a) => `<li><span class="act-icon" aria-hidden="true">${a.icon}</span>${esc(a[lang])}</li>`).join('')}</ul>
  ${chapter.forWho ? `<p class="for-who"><b>${t(lang, 'case.forWho')}:</b> ${esc(chapter.forWho[lang])}</p>` : ''}
  ${chapter.context ? `<details class="why"><summary>${t(lang, 'case.whyWorld')}</summary>
    <p class="context"><b>${t(lang, 'case.context')}</b> ${esc(chapter.context[lang])}</p></details>` : ''}
</section>`;
}

/** A full chapter. Secondary chapters arrive folded. */
function chapterHtml(group, lang) {
  const { chapter, rows, featured, state } = group;
  if (!rows.length) return '';
  const others = rows.filter((r) => r !== featured);
  const head = `<header class="chapter-head"><h3><span class="chapter-icon" aria-hidden="true">${chapter.icon}</span> ${esc(chapter.name[lang])}</h3>
  <p class="chapter-q">${esc(chapter.question[lang])}</p>${chipsHtml(rows, lang)}</header>`;
  const body = `<div class="chapter-body">${featured ? rowHtml(featured, lang, true) : ''}
  ${others.length ? `<details class="more"><summary>${t(lang, 'case.more')}</summary>${others.map((r) => rowHtml(r, lang)).join('')}</details>` : ''}
  ${adviceHtml(chapter, group, lang)}</div>`;
  if (chapter.open) return `<section class="chapter" data-chapter="${chapter.id}" data-state="${state}">${head}${body}</section>`;
  return `<details class="chapter folded" data-chapter="${chapter.id}" data-state="${state}"><summary><span class="chapter-icon" aria-hidden="true">${chapter.icon}</span> ${esc(chapter.name[lang])} · <span class="muted">${esc(chapter.question[lang])}</span></summary>${body}</details>`;
}

/** Draws the full case file of a place inside `container`. */
function renderCase(container, model, lang, { story = null } = {}) {
  const period = model.period.from ? t(lang, 'case.period', model.period) : '';
  container.innerHTML = `<section class="case">
  <header class="case-head"><h2>${esc(model.place.label)}</h2>
    <p class="muted small">${period} · NASA POWER</p>
    <p class="summary">${t(lang, model.summary, model.period)}</p>
    ${story ? `<p class="story">${esc(story)}</p>` : ''}</header>
  ${model.chapters.map((g) => chapterHtml(g, lang)).join('')}
  <details class="method"><summary>${t(lang, 'method.title')}</summary><p>${t(lang, 'method')}</p></details>
  <p class="muted small">${t(lang, 'source')}</p>
</section>`;
}

/** Draws the table that compares two places. */
function renderCompare(container, modelA, modelB, lang) {
  const rows = compareRows(modelA, modelB);
  const cell = (row, x) => x.verdict === 'insufficient' ? `<td class="muted">—</td>`
    : `<td><strong>${esc(formatRate(x.perDecade, unitOf(row.variable, lang), row.variable.decimals, lang))}</strong><br><span class="verdict small" style="--vc:${VERDICT_COLOR[x.verdict]}">${t(lang, verdictKey(x))}</span></td>`;
  container.innerHTML = `<section class="compare"><h2>${t(lang, 'compare.title')}</h2>
<table><thead><tr><td></td><th scope="col">${esc(modelA.place.label)}</th><th scope="col">${esc(modelB.place.label)}</th><td></td></tr></thead><tbody>
${rows.map((r) => `<tr class="${r.opposite ? 'opposite' : ''}"><th scope="row">${esc(r.variable.name[lang])}</th>${cell(r, r.a)}${cell(r, r.b)}<td>${t(lang, r.opposite ? 'compare.opposite' : r.same ? 'compare.same' : 'compare.unclear')}</td></tr>`).join('')}
</tbody></table></section>`;
}

/** Shows an error message (key of the text catalogue). */
function renderError(container, key, lang, vars = {}) {
  container.innerHTML = `<p class="error" role="alert">${esc(t(lang, key, vars))}</p>`;
}

/** Shows the loading notice. */
function renderLoading(container, lang) {
  container.innerHTML = `<p class="loading" role="status">${t(lang, 'loading')}</p>`;
}

/**
 * Generates the image to share (1080×1350) by drawing the case file on a <canvas>.
 * @returns {Promise<Blob>} PNG image
 */
/** Rounded-corner rectangle, for the panels of the image. */
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) { g.roundRect(x, y, w, h, r); return; }
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/** Writes a text, splitting it into lines that fit the given width. */
function wrapText(g, text, x, y, maxW, lh) {
  let line = '';
  for (const word of String(text).split(' ')) {
    const probe = line ? `${line} ${word}` : word;
    if (g.measureText(probe).width > maxW && line) { g.fillText(line, x, y); y += lh; line = word; }
    else line = probe;
  }
  if (line) g.fillText(line, x, y);
  return y + lh;
}

async function caseToPng(model, lang, siteUrl = '') {
  const W = 1080, H = 1350, P = 56;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const INK = '#ffffff', SOFT = '#9fb0c0', MID = '#d7e0ea';
  const tone = { yes: '#ff8a80', maybe: '#ffcc66', none: SOFT, insufficient: SOFT };

  const panels = [];   // painted at the end, behind the content
  g.fillStyle = INK; g.font = '600 28px system-ui, sans-serif'; g.fillText('Earth Trend Detective', P, 64);
  g.font = '700 50px system-ui, sans-serif';
  let title = model.place.label.split(',').slice(0, 2).join(',');
  // The right-hand corner is left free for the team seal.
  while (g.measureText(title).width > W - 2 * P - 150 && title.length > 4) title = title.slice(0, -2) + '…';
  g.fillText(title, P, 128);
  g.fillStyle = SOFT; g.font = '24px system-ui, sans-serif';
  if (model.period.from) g.fillText(`${model.period.from}–${model.period.to} · NASA POWER`, P, 166);
  g.fillStyle = MID; g.font = '600 27px system-ui, sans-serif';
  let y = wrapText(g, t(lang, model.summary, model.period), P, 212, W - 2 * P, 34) + 16;

  for (const group of model.chapters) {
    const { chapter, featured } = group;
    if (!chapter.open || !featured) continue;
    const v = featured.variable, r = featured.result;
    const top = y;

    // Chapter colour bar, to the left of its panel.
    g.fillStyle = chapter.tint; g.fillRect(P - 24, y + 6, 6, 40);
    g.fillStyle = INK; g.font = '700 32px system-ui, sans-serif';
    g.fillText(`${chapter.icon} ${chapter.name[lang].toUpperCase()}`, P, y + 26);
    g.fillStyle = SOFT; g.font = '23px system-ui, sans-serif';
    g.fillText(chapter.question[lang], P, y + 56);
    y += 80;

    // The chapter's main variable, with its stripes.
    g.fillStyle = INK; g.font = '600 27px system-ui, sans-serif'; g.fillText(v.name[lang], P, y + 22);
    g.fillStyle = tone[r.verdict]; g.font = '600 24px system-ui, sans-serif';
    g.textAlign = 'right'; g.fillText(t(lang, verdictKey(r)), W - P, y + 22); g.textAlign = 'left';
    const colors = stripeColors(featured.annual, v.palette), bw = (W - 2 * P) / Math.max(1, colors.length);
    colors.forEach((col, i) => { g.fillStyle = col; g.fillRect(P + i * bw, y + 38, bw + 0.5, 46); });
    y += 96;
    if (r.verdict !== 'insufficient') {
      g.fillStyle = MID; g.font = '600 26px system-ui, sans-serif';
      const range = t(lang, 'case.range', { lo: formatNum(r.ci.lo * 10, v.decimals, lang, true), hi: formatNum(r.ci.hi * 10, v.decimals, lang, true) });
      g.fillText(`${formatRate(r.perDecade, unitOf(v, lang), v.decimals, lang)}  (${range})`, P, y + 20);
      y += 34;
    }

    const b = featured.birth;
    if (b && b.status === 'ok') {
      g.fillStyle = '#7dd3fc'; g.font = '600 23px system-ui, sans-serif';
      const tag = `${t(lang, 'birth.title')} (${b.fromYear}): `;
      g.fillText(tag, P, y + 20);
      g.fillStyle = INK; g.font = '700 25px system-ui, sans-serif';
      g.fillText(`${formatNum(b.diff, v.decimals, lang, true)} ${unitOf(v, lang)}`, P + g.measureText(tag).width + 6, y + 20);
      y += 38;
    }

    // The advice that follows that result, in two columns.
    const acts = chapter.actions ? (chapter.actions[group.evidence && group.direction ? group.direction : 'none'] || []) : [];
    if (acts.length) {
      g.fillStyle = '#7dd3fc'; g.font = '700 20px system-ui, sans-serif';
      g.fillText(t(lang, 'case.means').toUpperCase(), P, y + 24);
      y += 38;
      const colW = (W - 2 * P) / 2 - 10;
      let row = y;
      acts.forEach((a, i) => {
        const x = P + (i % 2) * (colW + 20);
        if (i % 2 === 0 && i) row += 62;
        g.fillStyle = 'rgba(148,163,184,0.12)';
        g.fillRect(x, row, colW, 54);
        g.font = '26px system-ui, sans-serif'; g.fillStyle = INK;
        g.fillText(a.icon, x + 14, row + 36);
        g.font = '22px system-ui, sans-serif'; g.fillStyle = MID;
        let s = a[lang];
        while (g.measureText(s).width > colW - 60 && s.length > 6) s = s.slice(0, -2) + '…';
        g.fillText(s, x + 54, row + 35);
      });
      y = row + 54 + 22;
    }
    panels.push({ top: top - 16, bottom: y, tint: chapter.tint });
    y += 34;
  }

  // The panels and the background go underneath everything already drawn.
  g.globalCompositeOperation = 'destination-over';
  for (const p of panels) {
    g.fillStyle = 'rgba(148,163,184,0.10)';
    roundRect(g, P - 32, p.top, W - 2 * (P - 32), p.bottom - p.top, 18); g.fill();
  }
  g.fillStyle = '#0f1720'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over';

  // Team seal, top right, with its name below.
  const seal = await sealImage();
  const S = 92, sx = W - P - S;
  if (seal) g.drawImage(seal, sx, 28, S, S);
  g.fillStyle = '#9ff3e6'; g.font = '700 15px system-ui, sans-serif';
  g.textAlign = 'center';
  TEAM.lines.forEach((line, i) => g.fillText(line, sx + S / 2, 28 + S + 20 + i * 18));
  g.textAlign = 'left';

  g.fillStyle = MID; g.font = '600 22px system-ui, sans-serif';
  g.fillText(t(lang, 'disclaimer'), P, H - 104);
  g.fillStyle = SOFT; g.font = '19px system-ui, sans-serif';
  wrapText(g, `${t(lang, 'source')}${siteUrl ? ` · ${siteUrl}` : ''}`, P, H - 72, W - 2 * P, 26);
  return new Promise((resolve) => c.toBlob(resolve, 'image/png'));
}

/**
 * app.js — Entry point: connects the page with the modules.
 *
 * Flow of a search:
 *   1. geo.js    turns the text (or a point on the globe) into coordinates.
 *   2. power.js  requests that point's data from NASA POWER and turns it into annual series.
 *   3. model.js  applies the statistics (stats.js, heat.js) and "since you were born" (birth.js).
 *   4. ui.js     draws the case file.
 * The example cases follow the same path, but read data saved in data/demos/.
 *
 * The place is picked on a 3D globe (globe.js) or on the flat map, which deliver the same
 * thing: a latitude and a longitude. If the globe cannot load, the flat map remains.
 */


const $ = (id) => document.getElementById(id);
const state = {
  lang: 'en', demos: [], main: null, other: null, // opens in English; the button switches to Spanish
  globe: null, map: null, marker: null, view: 'globe',
  loading: false, error: null, errorVars: {},
};

function applyTexts() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(state.lang, el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => { el.placeholder = t(state.lang, el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => { el.setAttribute('aria-label', t(state.lang, el.dataset.i18nAria)); });
  $('lang').textContent = t(state.lang, 'lang.switch');
  $('view-toggle').textContent = t(state.lang, state.view === 'globe' ? 'geo.flat' : 'geo.globe');
  $('map-hint').textContent = t(state.lang, state.view === 'globe' ? 'search.globe' : 'search.map');
  renderDemoButtons();
}

function renderDemoButtons() {
  for (const [boxId, slot] of [['demo-buttons', 'main'], ['compare-demos', 'other']]) {
    const box = $(boxId); box.innerHTML = '';
    for (const d of state.demos) {
      const b = document.createElement('button'); b.type = 'button';
      b.textContent = labelOf(d.place, state.lang);
      const s = document.createElement('span'); s.textContent = d.kind[state.lang]; b.appendChild(s);
      b.addEventListener('click', () => loadDemo(d.id, slot));
      box.appendChild(b);
    }
  }
}

const MAX_BIRTH = new Date().getFullYear();
/** Year of birth typed by the user; null if empty or out of range. */
const birthYear = () => {
  const raw = $('birth').value.trim(), v = Number(raw);
  return raw && Number.isInteger(v) && v >= 1900 && v <= MAX_BIRTH ? v : null;
};
const birthInvalid = () => $('birth').value.trim() !== '' && birthYear() === null;

/** Redraws everything from the current state. */
function draw() {
  if (state.loading) renderLoading($('status'), state.lang);
  else if (state.error) renderError($('status'), state.error, state.lang, state.errorVars);
  else $('status').innerHTML = '';
  if (state.main) {
    renderCase($('case'), state.main.model, state.lang, { story: state.main.story?.[state.lang] });
    $('tools').hidden = false;
  }
  if (state.main && state.other) renderCompare($('compare'), state.main.model, state.other.model, state.lang);
  else $('compare').innerHTML = '';
}
function fail(key, vars) { state.loading = false; state.error = key; state.errorVars = vars; draw(); }

/** Rebuilds a slot's model with the current language and year of birth. */
function rebuild(slot) {
  const s = state[slot];
  if (!s) return;
  s.model = buildCase(s.parsed, { ...s.place, label: labelOf(s.place, state.lang) }, birthYear());
}

function setSlot(slot, parsed, place, story = null) {
  let model;
  // If the calculation or the drawing fails, the user is told: the page never stays loading forever.
  try { model = buildCase(parsed, { ...place, label: labelOf(place, state.lang) }, birthYear()); }
  catch (e) { console.error(e); fail('error.api'); return; }
  if (!hasData(model)) { fail('error.noData'); return; }
  state[slot] = { parsed, place, story, model };
  state.loading = false;
  state.error = birthInvalid() ? 'error.birth' : null; state.errorVars = { max: MAX_BIRTH };
  if (slot === 'main') { state.other = null; seq.other++; markPlace(place); }
  try { draw(); } catch (e) { console.error(e); fail('error.api'); return; }
  if (slot === 'other') $('compare').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Each search gets a number. If, when the response arrives, another search has already
// been launched for the same slot, the old response is discarded (so it cannot overwrite the new one).
const seq = { main: 0, other: 0 };

async function loadPlace(place, slot = 'main', id = ++seq[slot]) {
  state.loading = true; state.error = null; draw();
  let json;
  try { json = await fetchPower(place.lat, place.lon); }
  catch (e) { if (id === seq[slot]) { console.error(e); fail('error.api'); } return; }
  if (id !== seq[slot]) return;
  setSlot(slot, parseAll(json), place);
  // A tapped point arrives without a name: it gets one later, without making anyone wait.
  if (!place.geo) nameLater(place, slot, id);
}

/** Requests the point's name and, if it arrives in time, puts it in the case file. */
async function nameLater(place, slot, id) {
  const lang = state.lang;
  const name = await nameOfPoint(place.lat, place.lon, lang);
  if (!name || id !== seq[slot] || lang !== state.lang || !state[slot]) return;
  state[slot].place = { ...place, label: name, geo: true };
  rebuild(slot);
  draw();
}

function loadDemo(id, slot = 'main') {
  const d = state.demos.find((x) => x.id === id);
  if (!d) return;
  seq[slot]++; // cancels any search in progress for this slot
  setSlot(slot, d.parsed, d.place, d.story);
}

/**
 * Suggestions while typing. It waits until the user stops typing
 * (300 ms) and cancels the previous query, so as not to flood the service.
 */
const suggestions = new Map(); // label → { lat, lon, label }
function wireSuggest(inputId, listId) {
  let timer = null, ctrl = null;
  $(inputId).addEventListener('input', () => {
    clearTimeout(timer);
    if (ctrl) ctrl.abort();
    const q = $(inputId).value;
    timer = setTimeout(async () => {
      ctrl = new AbortController();
      const found = await suggestPlaces(q, state.lang, { signal: ctrl.signal });
      const list = $(listId);
      list.innerHTML = '';
      for (const s of found) {
        suggestions.set(s.label, { ...s, geo: true });
        const opt = document.createElement('option'); opt.value = s.label; list.appendChild(opt);
      }
    }, 300);
  });
}

async function onSearch(inputId, slot) {
  const q = $(inputId).value;
  // The number is taken before any early return: that way an empty submit also cancels
  // the previous search, and its late response cannot overwrite the error message.
  const id = ++seq[slot];
  if (!q.trim()) { fail('error.notFound'); return; }
  state.loading = true; state.error = null; draw();
  // If a suggestion was picked we already have its coordinates: no need to search again.
  const picked = suggestions.get(q.trim());
  if (picked) { await loadPlace(picked, slot, id); return; }
  let place = null;
  try { place = await searchPlace(q, state.lang); }
  catch (e) { if (id === seq[slot]) { console.error(e); fail('error.search'); } return; }
  if (id !== seq[slot]) return;
  if (!place) { fail('error.notFound'); return; }
  await loadPlace({ ...place, geo: true }, slot, id);
}

/* ---------- Picking the place: 3D globe or flat map ---------- */

/** A tap on the globe or the map: same coordinates, same path. */
function pick(lat, lon, place) {
  const la = +lat.toFixed(2), lo = +(((lon + 540) % 360) - 180).toFixed(2);
  loadPlace(place || { lat: la, lon: lo, label: `${la}, ${lo}` });
}

function initGlobe() {
  state.globe = createGlobe($('globe'), {
    places: state.demos.map((d) => ({ ...d.place, label: labelOf(d.place, state.lang) })),
    onPick: (lat, lon, p) => (p ? loadDemoByPlace(p) : pick(lat, lon)),
  });
  if (!state.globe) { setView('map'); $('view-toggle').hidden = true; return; }
  addEventListener('resize', () => state.globe.resize());
}

/** Tapping a globe marker opens that example case. */
function loadDemoByPlace(p) {
  const d = state.demos.find((x) => x.place.lat === p.lat && x.place.lon === p.lon);
  if (d) loadDemo(d.id); else pick(p.lat, p.lon);
}

function initMap() {
  if (!window.L || state.map) return;
  state.map = L.map('map', { worldCopyJump: true }).setView([-10, -60], 2);
  // Map built only from NASA layers (GIBS service): no API key required.
  const gibs = (layer, matrix, ext) => `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${layer}/default/${matrix}/{z}/{y}/{x}.${ext}`;
  L.tileLayer(gibs('BlueMarble_ShadedRelief_Bathymetry', 'GoogleMapsCompatible_Level8', 'jpeg'), { maxNativeZoom: 8, maxZoom: 10, attribution: 'NASA GIBS' }).addTo(state.map);
  L.tileLayer(gibs('Reference_Features', 'GoogleMapsCompatible_Level9', 'png'), { maxNativeZoom: 9, maxZoom: 10 }).addTo(state.map);
  L.tileLayer(gibs('Reference_Labels', 'GoogleMapsCompatible_Level9', 'png'), { maxNativeZoom: 9, maxZoom: 10 }).addTo(state.map);
  state.map.on('click', (e) => pick(e.latlng.lat, e.latlng.lng));
}

/** Switches between the globe and the flat map. The map is created the first time it is needed. */
function setView(view) {
  state.view = view;
  const onGlobe = view === 'globe';
  $('globe').hidden = !onGlobe;
  $('map').hidden = onGlobe;
  $('globe-zoom').hidden = !onGlobe;
  if (!onGlobe) { initMap(); if (state.map) setTimeout(() => state.map.invalidateSize(), 50); }
  else if (state.globe) state.globe.resize();
  if (state.main) markPlace(state.main.place);
  applyTexts();
}

/** Marks the picked place on the active view. */
function markPlace(place) {
  if (state.globe) { state.globe.setPicked(place.lat, place.lon); }
  if (state.map) {
    if (state.marker) state.marker.remove();
    state.marker = L.marker([place.lat, place.lon]).addTo(state.map);
    state.map.setView([place.lat, place.lon], Math.max(state.map.getZoom(), 5));
  }
}

/* ---------- Language switch ---------- */

let langSeq = 0;
/**
 * Place names that came from the search are requested again in the new language,
 * so that the whole case file is in a single language. If the service fails, the
 * existing name is kept.
 */
async function switchLang() {
  state.lang = state.lang === 'es' ? 'en' : 'es';
  const mine = ++langSeq, lang = state.lang;
  for (const slot of ['main', 'other']) if (state[slot]) rebuild(slot);
  applyTexts();
  if (state.globe) state.globe.setMarks(state.demos.map((d) => ({ ...d.place, label: labelOf(d.place, lang) })));
  draw();

  for (const slot of ['main', 'other']) {
    const s = state[slot];
    if (!s?.place.geo) continue;
    const name = await nameOfPoint(s.place.lat, s.place.lon, lang);
    if (!name || mine !== langSeq || !state[slot]) continue;
    state[slot].place = { ...state[slot].place, label: name };
    rebuild(slot);
  }
  if (mine === langSeq) draw();
}

async function init() {
  $('brand-seal').src = SEAL_URI; // team seal in the header
  $('search').addEventListener('submit', (e) => { e.preventDefault(); onSearch('q', 'main'); });
  $('compare-form').addEventListener('submit', (e) => { e.preventDefault(); onSearch('q2', 'other'); });
  $('birth').addEventListener('change', () => {
    for (const slot of ['main', 'other']) rebuild(slot);
    state.error = birthInvalid() ? 'error.birth' : null; state.errorVars = { max: MAX_BIRTH };
    draw();
  });
  $('lang').addEventListener('click', switchLang);
  $('view-toggle').addEventListener('click', () => setView(state.view === 'globe' ? 'map' : 'globe'));
  $('zoom-in').addEventListener('click', () => state.globe && state.globe.zoom(0.75));
  $('zoom-out').addEventListener('click', () => state.globe && state.globe.zoom(1.35));
  $('download').addEventListener('click', async () => {
    if (!state.main) return;
    const site = location.protocol === 'http:' || location.protocol === 'https:' ? location.host + location.pathname : '';
    const blob = await caseToPng(state.main.model, state.lang, site);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'earth-trend-detective.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  wireSuggest('q', 'places');
  wireSuggest('q2', 'places2');
  applyTexts();

  try {
    if (window.__DEMOS__) state.demos = window.__DEMOS__; // single-file version
    else {
      const idx = await (await fetch('data/demos/index.json')).json();
      state.demos = await Promise.all(idx.map(async (d) => ({ ...d, ...(await (await fetch(`data/demos/${d.file}`)).json()) })));
    }
    renderDemoButtons();
  } catch { /* no example cases: live search keeps working */ }

  initGlobe();
}
init();

})();</script>
</body>
